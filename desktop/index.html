<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview · Network Manager</title>
    <link rel="icon" href="./mark.svg" />
    <link rel="stylesheet" href="./workspace.css" />
    <script type="module" src="./workspace.js"></script>
  </head>
  <body>
    <a class="skip" href="#page-title">Skip to workspace</a>
    <aside class="sidebar" aria-label="Application sidebar">
      <div class="brand">
        <img src="./mark.svg" alt="" width="32" height="32" />
        <strong>Network Manager</strong>
      </div>
      <div class="sidebar-scroll">
        <button
          id="commands"
          title="Commands and keyboard shortcuts (Ctrl K)"
          aria-label="Commands and keyboard shortcuts"
        >
          <span data-icon="search"></span><span class="side-label">Commands</span><kbd>Ctrl K</kbd>
        </button>
        <nav aria-label="Workspace" id="nav"></nav>
        <button class="side-action" data-do="classic" title="Classic tools" aria-label="Classic tools">
          <span data-icon="ext"></span><span class="side-label">Classic tools</span>
        </button>
      </div>
      <footer class="sidebar-foot">
        <button
          id="sidebar-toggle"
          class="side-action"
          type="button"
          aria-controls="nav"
          aria-expanded="true"
          aria-label="Collapse sidebar"
          title="Collapse sidebar (Ctrl B)"
        >
          <span data-icon="collapse"></span><span class="side-label">Collapse sidebar</span>
        </button>
      </footer>
    </aside>
    <main>
      <div class="page">
        <div class="page-head">
          <div>
            <h1 id="page-title" tabindex="-1">Overview</h1>
            <p id="subtitle"></p>
          </div>
          <div id="toolbar"></div>
        </div>
        <div id="error" role="alert" hidden></div>
        <div id="view"></div>
      </div>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="notice" role="status"></div>
  </body>
</html>
