[package]
name = "network-manager"
version.workspace = true
edition = "2021"
authors = ["Christos A. Daggas <info@chrisdaggas.com>"]
license = "MIT"
description = "Tauri desktop workspace for Network Manager on Linux"
repository = "https://github.com/christosdaggas/NetManager"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
gtk = "0.18"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
ashpd = {version="0.13",features=["global_shortcuts"]}
futures-util = "0.3"
tracing-subscriber = {version="0.3",features=["env-filter"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
zeroize = "1"
netmanager-core = { path = "../core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[package.metadata.deb]
name = "cd-network-manager"
depends = "$auto, network-manager, iproute2"
section = "utility"
priority = "optional"
assets = [
    ["target/release/network-manager", "usr/bin/", "755"],
    ["../data/com.chrisdaggas.network-manager.desktop", "usr/share/applications/", "644"],
    ["../data/icons/hicolor/scalable/apps/com.chrisdaggas.network-manager.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../data/com.chrisdaggas.network-manager.metainfo.xml", "usr/share/metainfo/", "644"],
]
