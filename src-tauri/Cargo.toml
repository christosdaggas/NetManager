[package]
name = "network-manager-workspace"
version = "1.0.0"
edition = "2021"
authors = ["Christos A. Daggas <info@chrisdaggas.com>"]
license = "MIT"
description = "Tauri desktop workspace for Network Manager on Linux"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
zeroize = "1"
netmanager-core = { path = "../core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
